# Configuracao do Render. Ao criar o servico, aponte para este arquivo
# (Blueprint) ou preencha os mesmos campos na mao.
#
# As variaveis estao com `sync: false` de proposito: isso diz ao Render para
# pedir o valor no painel em vez de guarda-lo aqui. Segredo nao entra em
# arquivo versionado.
#
# Por que o banco NAO e o Postgres do Render: o gratuito dele expira 30 dias
# depois de criado e apaga os dados. O DATABASE_URL abaixo aponta para o Neon,
# cujo plano gratuito e permanente. Ver o README.

services:
  - type: web
    name: webapp-compras
    runtime: node
    plan: free
    # Virginia é a região do Render mais próxima do Brasil. Escolha o Neon na
    # região equivalente (AWS us-east-1) para o salto servidor→banco ser curto.
    region: virginia
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/saude
    envVars:
      - key: NODE_VERSION
        value: "22"
      # String de conexao do Neon (nao do Render).
      - key: DATABASE_URL
        sync: false
      # Gere com: npm run senha:hash -- "sua senha"
      - key: SENHA_HASH
        sync: false
      # Qualquer string longa e aleatoria. Trocar desloga todos os aparelhos.
      - key: SESSAO_SEGREDO
        sync: false
      # Opcional: sem ela o app funciona e so as dicas ficam desligadas.
      - key: ANTHROPIC_API_KEY
        sync: false
      # `pago` libera a IA e os limites do plano. Qualquer outro valor, ou
      # nenhum, e o gratis. As dicas precisam das DUAS: a chave e o plano.
      - key: PLANO
        sync: false
      # Opcional: qual modelo faz as analises. Sem ela vale claude-haiku-5-5, o
      # mais barato. A lista aceita esta em compartilhado/modelos.ts; trocar
      # aqui nao pede novo deploy de codigo.
      - key: MODELO_IA
        sync: false
